<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishGuard AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #090D16;
      --bg-card: #121A2C;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-blue: #3B82F6;
      --accent-emerald: #10B981;
      --accent-rose: #EF4444;
      --text-primary: #F3F4F6;
      --text-muted: #9CA3AF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      padding: 1rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: #FFF;
    }

    .logo i {
      color: var(--accent-blue);
      font-size: 1.2rem;
    }

    .status-badge {
      font-size: 0.72rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .current-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      word-break: break-all;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.5rem;
      border-radius: 6px;
      margin-bottom: 0.8rem;
      max-height: 48px;
      overflow-y: auto;
    }

    .btn-scan {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-blue), #2563EB);
      color: #FFF;
      border: none;
      padding: 0.65rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .btn-scan:hover { opacity: 0.9; transform: translateY(-1px); }

    .verdict-box {
      display: none;
      text-align: center;
      padding: 1rem 0;
    }

    .badge-verdict {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .badge-verdict.safe {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .badge-verdict.danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-rose);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .confidence {
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .flags-list {
      text-align: left;
      margin-top: 0.8rem;
      font-size: 0.78rem;
      color: #FCA5A5;
      background: rgba(239, 68, 68, 0.1);
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .flags-list li {
      margin-left: 1rem;
      margin-bottom: 0.2rem;
    }

    .loader {
      display: none;
      text-align: center;
      padding: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-left-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 0.6rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <i class="fa-solid fa-shield-halved"></i>
      <span>PhishGuard AI</span>
    </div>
    <span class="status-badge">AI Active</span>
  </div>

  <div class="card">
    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem;">Active Tab URL:</div>
    <div class="current-url" id="active-url">Fetching active tab...</div>
    <button class="btn-scan" id="btn-scan">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Scan Active Page</span>
    </button>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <span>Extracting features & querying AI ensemble model...</span>
  </div>

  <div class="card verdict-box" id="verdict-box">
    <div id="verdict-badge" class="badge-verdict safe">
      <i id="verdict-icon" class="fa-solid fa-shield-check"></i>
      <span id="verdict-text">Safe / Legitimate</span>
    </div>
    <div class="confidence" id="confidence-score">99.8%</div>
    <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem;">Confidence Score</div>

    <div id="flags-container" style="display: none;" class="flags-list">
      <div style="font-weight: 700; margin-bottom: 0.3rem;">Security Risk Flags:</div>
      <ul id="flags-ul"></ul>
    </div>
  </div>

  <footer>
    PhishGuard AI &bull; Machine Learning Cyber Threat Intelligence
  </footer>

  <script src="popup.js"></script>
</body>
</html>
